name: SonarCloud analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: ["develop", "main"]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  sonarcloud:
    name: Set up and Run SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter and Java
        uses: ./.github/actions/setup-flutter-with-java

      - name: Run tests and generate coverage
        run: melos coverage:all

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          cat apps/multichoice/coverage/lcov.info packages/core/coverage/lcov.info > coverage/lcov.info
          cat coverage/lcov.info

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        with:
          args: -Dproject.settings=config/sonar-project.properties
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
