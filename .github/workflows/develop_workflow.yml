---
# This workflow is triggered on pull request closure for the 'develop' branch.
# It is responsible for building the Android app, running tests, and uploading artifacts.
# It also manages versioning based on labels applied to the pull request.
#
# The versioning works as follows (see .github/config/version-labels.json):
# - minor / feature → minor bump; patch / bug → patch bump (aliases in the same tier are OK)
# - If the pull request is merged and has no version labels, it will bump the build number only.
#   For example, if the current version is 1.0.0+5, it will become 1.0.0+6.
# - Cross-tier labels (e.g. minor + patch) are blocked by pr_version_labels.yml before merge.
# - If the pull request is merged and has the label 'no-build', it will skip the build process.
#
name: develop-workflow
on:
  pull_request:
    branches: ["develop"]
    types:
      - closed
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type for the develop build
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
      dry_run:
        description: "Dry run (manual testing): do not commit, tag, or publish"
        required: true
        type: boolean
        default: true

concurrency:
  group: develop-workflow-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preBuild:
    name: Prebuild - Version Management
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'no-build') == false) }}
    runs-on: ubuntu-latest
    concurrency:
      group: version-management-develop
      cancel-in-progress: false
    outputs:
      version_number: ${{ steps.version_management.outputs.version_number }}
      version_part: ${{ steps.version_management.outputs.version_part }}
      build_number: ${{ steps.version_management.outputs.build_number }}

    steps:
      ##############################################
      # Checkout Repository
      ##############################################
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      ##############################################
      # Generate GitHub App Token
      ##############################################
      - name: Generate GitHub App Token
        id: generate_token
        uses: peter-murray/workflow-application-token-action@v5
        with:
          application_id: ${{ secrets.VERSION_BOT_APP_ID }}
          application_private_key: ${{ secrets.VERSION_BOT_APP_PRIVATE_KEY }}

      ##############################################
      # Check Version Labels
      ##############################################
      - name: Check Version Labels
        id: check_labels
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/check-version-labels
        with:
          labels: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels) || '[]' }}
          target_branch: develop

      ##############################################
      # Resolve Bump Type
      ##############################################
      - name: Resolve Bump Type
        id: resolve_bump_type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_BUMP_TYPE: ${{ inputs.bump_type }}
          LABEL_BUMP_TYPE: ${{ steps.check_labels.outputs.bump_type }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "bump_type=$MANUAL_BUMP_TYPE" >> "$GITHUB_OUTPUT"
            echo "Using manual bump type: $MANUAL_BUMP_TYPE"
          else
            echo "bump_type=$LABEL_BUMP_TYPE" >> "$GITHUB_OUTPUT"
            echo "Using PR label bump type: $LABEL_BUMP_TYPE"
          fi

      ##############################################
      # Version Management
      ##############################################
      - name: Version Management
        id: version_management
        uses: ./.github/actions/version-management
        with:
          github_token: ${{ steps.generate_token.outputs.token }}
          pubspec_path: apps/multichoice/pubspec.yaml
          branch_name: develop
          bump_type: ${{ steps.resolve_bump_type.outputs.bump_type }}
          commit_changes: "false"

  build:
    name: Builds Android App
    needs: [preBuild]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      statuses: write
    steps:
      ##############################################
      # Checkout Repository
      ##############################################
      - name: Checkout Repository
        uses: actions/checkout@v7

      ##############################################
      # Set up Flutter and Java
      ##############################################
      - name: Set up Flutter and Java
        uses: ./.github/actions/setup-flutter-with-java

      ##############################################
      # Melos Coverage for Core
      ##############################################
      - name: Melos Coverage for Core
        run: melos coverage:core
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info
          fail_ci_if_error: true

      ##############################################
      # Download and Prepare Android Keystore, Config, Google Services
      ##############################################
      - name: Prepare Android release files (DEV)
        uses: ./.github/actions/prepare-android-release-files
        with:
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store_password: ${{ secrets.STORE_PASSWORD }}
          key_password: ${{ secrets.KEY_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          config_b64: ${{ secrets.DEV_CONFIG_B64 }}
          google_services_b64: ${{ secrets.DEV_GOOGLE_SERVICES_B64 }}
          flavor: dev
          package_name: co.za.zanderkotze.multichoice.dev

      ##############################################
      # Build APK
      ##############################################
      - name: Build APK
        env:
          FLUTTER_BUILD_NAME: ${{ needs.preBuild.outputs.version_part }}
          FLUTTER_BUILD_NUMBER: ${{ needs.preBuild.outputs.build_number }}
        run: flutter build apk --release --target lib/main_develop.dart --flavor dev --dart-define-from-file=config/develop_config.json --build-name=${{ env.FLUTTER_BUILD_NAME }} --build-number=${{ env.FLUTTER_BUILD_NUMBER }}
        working-directory: apps/multichoice/

      ##############################################
      # Upload APK as Artifact
      ##############################################
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: "android-release-apk"
          path: ./apps/multichoice/build/app/outputs/flutter-apk/app-dev-release.apk

      ##############################################
      # Build App Bundle
      ##############################################
      - name: Build App Bundle
        env:
          FLUTTER_BUILD_NAME: ${{ needs.preBuild.outputs.version_part }}
          FLUTTER_BUILD_NUMBER: ${{ needs.preBuild.outputs.build_number }}
        run: flutter build appbundle --release --target lib/main_develop.dart --flavor dev --dart-define-from-file=config/develop_config.json --build-name=${{ env.FLUTTER_BUILD_NAME }} --build-number=${{ env.FLUTTER_BUILD_NUMBER }}
        working-directory: apps/multichoice/

      ##############################################
      # Upload App Bundle as Artifact
      ##############################################
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: "android-release-appbundle"
          path: ./apps/multichoice/build/app/outputs/bundle/devRelease/app-dev-release.aab

      ##############################################
      # Upload APK to Firebase App Distribution
      ##############################################
      - name: Upload APK to Firebase App Distribution
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.DEV_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.DEV_SERVICE_CREDENTIAL_FILE_CONTENT }}
          groups: testers
          file: ./apps/multichoice/build/app/outputs/flutter-apk/app-dev-release.apk
          releaseNotesFile: ./CHANGELOG.md
          debug: true

      ##############################################
      # Commit Version Update (after successful deploy)
      ##############################################
      - name: Generate GitHub App Token (for version commit)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        id: generate_token_commit
        uses: peter-murray/workflow-application-token-action@v5
        with:
          application_id: ${{ secrets.VERSION_BOT_APP_ID }}
          application_private_key: ${{ secrets.VERSION_BOT_APP_PRIVATE_KEY }}

      - name: Commit Version Update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: ./.github/actions/version-management
        with:
          github_token: ${{ steps.generate_token_commit.outputs.token }}
          pubspec_path: apps/multichoice/pubspec.yaml
          branch_name: develop
          bump_type: none
          target_version: ${{ needs.preBuild.outputs.version_number }}
          commit_changes: "true"

      ##############################################
      # Create New Tag
      ##############################################
      - name: Create New Tag
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: ./.github/actions/create-git-tag
        with:
          version_number: ${{ needs.preBuild.outputs.version_number }}
          tag_strategy: "full"
          allowed_formats: "both"

      ##############################################
      # Send Success Notification
      ##############################################
      - name: Send Success Notification
        uses: ./.github/actions/deployment-notification
        with:
          deployment_status: success
          environment: develop
          version: ${{ needs.preBuild.outputs.version_number }}
          branch: develop
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          email_recipients: ${{ secrets.DEPLOYMENT_EMAIL_RECIPIENTS }}

  notify-failure:
    name: Notify Deployment Failure
    needs: [preBuild, build]
    runs-on: ubuntu-latest
    if: failure() && needs.preBuild.result != 'skipped'
    permissions:
      contents: read
      issues: write
    steps:
      ##############################################
      # Checkout Repository
      ##############################################
      - name: Checkout Repository
        uses: actions/checkout@v7

      ##############################################
      # Send Failure Notification
      ##############################################
      - name: Send Failure Notification
        uses: ./.github/actions/deployment-notification
        with:
          deployment_status: failure
          environment: develop
          version: ${{ needs.preBuild.outputs.version_number }}
          branch: develop
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          email_recipients: ${{ secrets.DEPLOYMENT_EMAIL_RECIPIENTS }}
