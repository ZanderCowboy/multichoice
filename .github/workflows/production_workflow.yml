---
# This workflow is manually triggered.
# It builds the Android app, uploads artifacts, publishes to Play, tags the release,
# and can optionally create a GitHub release.
#
# Versioning works as follows:
# - Reads the current version from apps/multichoice/pubspec.yaml on the target branch
# - Expects an RC version (X.Y.Z-RC+N) and promotes it to production (X.Y.Z+N+1)
#   Example: 2.4.1-RC+125 -> 2.4.1+126
# - Optional release_version input overrides the semver (X.Y.Z) while still incrementing build
# - Semantic bumps are handled in the staging (RC) workflow; this workflow only strips RC
# - Creates a version-only tag from the finalized version (for example, v2.4.1)
#
name: production-workflow
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (manual testing): do not commit, tag, or publish"
        required: true
        type: boolean
        default: true
      target_branch:
        description: "Branch to build and update"
        required: true
        type: string
        default: main
      skip_github_release:
        description: "Skip creating a GitHub Release"
        required: true
        type: boolean
        default: false
      release_version:
          description: "Optional manual version override (e.g. 2.4.1). Takes precedence over RC suffix removal."
          required: false
          type: string
          default: ""

concurrency:
  group: production-workflow
  cancel-in-progress: true

jobs:
  preBuild:
    name: Prebuild - Version Management
    runs-on: ubuntu-latest
    concurrency:
      group: version-management-production
      cancel-in-progress: false
    outputs:
      version_number: ${{ steps.get_current_version.outputs.version_with_build }}
      version_part: ${{ steps.get_current_version.outputs.current_version }}
      build_number: ${{ steps.get_current_version.outputs.build_number }}

    steps:
      ##############################################
      # Checkout Repository
      ##############################################
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}

      ##############################################
      # Get Current Version From pubspec.yaml
      ##############################################
      - name: Get Current Version From pubspec.yaml
        id: get_current_version
        shell: bash
        run: |
          set -euo pipefail

          pubspec_path="apps/multichoice/pubspec.yaml"
          if [[ ! -f "$pubspec_path" ]]; then
            echo "::error::pubspec.yaml not found at $pubspec_path"
            exit 1
          fi

          version_line="$(grep -E '^[[:space:]]*version:[[:space:]]*' "$pubspec_path" | head -n1 || true)"
          if [[ -z "$version_line" ]]; then
            echo "::error::No version found in $pubspec_path"
            exit 1
          fi

          current_version_raw="$(echo "$version_line" | sed -E 's/^[[:space:]]*version:[[:space:]]*//')"
          current_version_raw="$(echo "$current_version_raw" | tr -d '\r' | xargs)"
          echo "pubspec_version=$current_version_raw"

          version_part="$(echo "$current_version_raw" | cut -d'+' -f1)"
          build_number="$(echo "$current_version_raw" | cut -d'+' -f2)"

          if [[ -z "$version_part" || -z "$build_number" ]]; then
            echo "::error::Invalid pubspec version format (expected X.Y.Z-RC+N): $current_version_raw"
            exit 1
          fi

          if [[ "$version_part" != *"-RC" ]]; then
            echo "::error::Expected RC version in pubspec (X.Y.Z-RC+N), got: $current_version_raw"
            exit 1
          fi

          version_without_rc="${version_part%-RC}"
          if ! echo "$version_without_rc" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version after removing RC: $version_without_rc"
            exit 1
          fi

          manual_override="$(echo "${{ inputs.release_version }}" | tr -d '\r' | xargs || true)"
          if [[ -n "$manual_override" ]]; then
            if ! echo "$manual_override" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid release_version override: $manual_override. Expected format: X.Y.Z"
              exit 1
            fi
            echo "Using manual version override: $manual_override (pubspec RC semver was $version_without_rc)"
            version_without_rc="$manual_override"
          fi

          if ! echo "$build_number" | grep -qE '^[0-9]+$'; then
            echo "::error::Invalid build number in pubspec: $build_number"
            exit 1
          fi

          new_build_number=$((build_number + 1))

          echo "version_without_rc=$version_without_rc" >> "$GITHUB_OUTPUT"
          echo "build_number=$new_build_number" >> "$GITHUB_OUTPUT"
          echo "version_with_build=$version_without_rc+$new_build_number" >> "$GITHUB_OUTPUT"
          echo "current_version=$version_without_rc" >> "$GITHUB_OUTPUT"

  build:
    name: Builds Android App
    needs: [preBuild]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://play.google.com/console/u/0/developers/8783535225973670504/app/4976133683768209199/app-dashboard
    permissions:
      contents: write
      packages: read
      statuses: write
    outputs:
      tag_version: ${{ steps.create_tag.outputs.tag_version }}
      build_number: ${{ needs.preBuild.outputs.build_number }}
    steps:
      ##############################################
      # Checkout Repository
      ##############################################
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch }}

      ##############################################
      # Set up Flutter and Java
      ##############################################
      - name: Set up Flutter and Java
        uses: ./.github/actions/setup-flutter-with-java

      ##############################################
      # Melos Coverage for Core
      ##############################################
      - name: Melos Coverage for Core
        run: melos coverage:core
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/lcov.info
          fail_ci_if_error: true

      ##############################################
      # Download and Prepare Android Keystore, Config, Google Services
      ##############################################
      - name: Prepare Android release files (PROD)
        uses: ./.github/actions/prepare-android-release-files
        with:
          android_keystore_base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          store_password: ${{ secrets.STORE_PASSWORD }}
          key_password: ${{ secrets.KEY_PASSWORD }}
          key_alias: ${{ secrets.KEY_ALIAS }}
          config_b64: ${{ secrets.PROD_CONFIG_B64 }}
          google_services_b64: ${{ secrets.PROD_GOOGLE_SERVICES_B64 }}
          flavor: prod
          package_name: co.za.zanderkotze.multichoice

      ##############################################
      # Build APK
      ##############################################
      - name: Build APK
        env:
          FLUTTER_BUILD_NAME: ${{ needs.preBuild.outputs.version_part }}
          FLUTTER_BUILD_NUMBER: ${{ needs.preBuild.outputs.build_number }}
        run: flutter build apk --release --target lib/main_production.dart --flavor prod --dart-define-from-file=config/production_config.json --build-name=${{ env.FLUTTER_BUILD_NAME }} --build-number=${{ env.FLUTTER_BUILD_NUMBER }}
        working-directory: apps/multichoice/

      ##############################################
      # Upload APK as Artifact
      ##############################################
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: "android-release-apk"
          path: ./apps/multichoice/build/app/outputs/flutter-apk/app-prod-release.apk

      ##############################################
      # Build App Bundle
      ##############################################
      - name: Build App Bundle
        env:
          FLUTTER_BUILD_NAME: ${{ needs.preBuild.outputs.version_part }}
          FLUTTER_BUILD_NUMBER: ${{ needs.preBuild.outputs.build_number }}
        run: flutter build appbundle --release --target lib/main_production.dart --flavor prod --dart-define-from-file=config/production_config.json --build-name=${{ env.FLUTTER_BUILD_NAME }} --build-number=${{ env.FLUTTER_BUILD_NUMBER }}
        working-directory: apps/multichoice/

      ##############################################
      # Upload App Bundle as Artifact
      ##############################################
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: "android-release-appbundle"
          path: ./apps/multichoice/build/app/outputs/bundle/prodRelease/app-prod-release.aab

      ###############################################
      # Release to Google Play Production Track
      ###############################################.
      - name: Release Build to production track
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: r0adkll/upload-google-play@v1
        with:
          releaseFiles: apps/multichoice/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: "co.za.zanderkotze.multichoice"
          track: "production"
          releaseName: ${{ needs.preBuild.outputs.version_part }}
          status: "completed"

      ##############################################
      # Commit Version Update (after successful deploy)
      ##############################################
      - name: Generate GitHub App Token (for version commit)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        id: generate_token_commit
        uses: peter-murray/workflow-application-token-action@v4
        with:
          application_id: ${{ secrets.VERSION_BOT_APP_ID }}
          application_private_key: ${{ secrets.VERSION_BOT_APP_PRIVATE_KEY }}

      - name: Commit Version Update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: ./.github/actions/tokenized-commit
        with:
          github_token: ${{ steps.generate_token_commit.outputs.token }}
          repository: ${{ github.repository }}
          file_path: apps/multichoice/pubspec.yaml
          commit_message: "Release version ${{ needs.preBuild.outputs.version_number }} [skip ci]"
          branch_name: ${{ inputs.target_branch }}
          version_with_build: ${{ needs.preBuild.outputs.version_number }}

      ##############################################
      # Create New Tag
      ##############################################
      - name: Create New Tag
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        id: create_tag
        uses: ./.github/actions/create-git-tag
        with:
          version_number: ${{ needs.preBuild.outputs.version_number }}
          tag_strategy: "version-only"
          allowed_formats: "standard"

      ##############################################
      # Send Dry Run Success Notification
      ##############################################
      - name: Send Dry Run Success Notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: ./.github/actions/deployment-notification
        with:
          deployment_status: success
          environment: production
          version: ${{ needs.preBuild.outputs.version_number }}
          branch: ${{ inputs.target_branch }}
          dry_run: true
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          email_recipients: ${{ secrets.DEPLOYMENT_EMAIL_RECIPIENTS }}

  create-release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.build.outputs.tag_version != '' && !inputs.skip_github_release && !inputs.dry_run
    steps:
      ##############################################
      # Checkout Repository
      ##############################################
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch }}

      ##############################################
      # Download APK Artifact
      ##############################################
      - name: Download APK Artifact
        uses: actions/download-artifact@v8
        with:
          name: "android-release-apk"
          path: ./artifacts/

      ##############################################
      # Create GitHub Release
      ##############################################
      - name: Create GitHub Release (and upload APK)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.tag_version }}
          name: Release v${{ needs.build.outputs.tag_version }}
          body: |
            ## What's New in v${{ needs.build.outputs.tag_version }}

            This release includes the latest features and improvements for MultiChoice.

            ### Download
            - **APK**: Available for direct download below
            - **Google Play**: Available on the [Google Play Store](https://play.google.com/store/apps/details?id=co.za.zanderkotze.multichoice)

            ### Technical Details
            - Platform: Android

            ### Release Notes
            For detailed release notes, please check the [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) file.
          files: |
            ./artifacts/app-prod-release.apk
          draft: false
          prerelease: false

      ##############################################
      # Send Success Notification
      ##############################################
      - name: Send Success Notification
        uses: ./.github/actions/deployment-notification
        with:
          deployment_status: success
          environment: production
          version: ${{ needs.build.outputs.tag_version }}
          branch: main
          dry_run: false
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          email_recipients: ${{ secrets.DEPLOYMENT_EMAIL_RECIPIENTS }}

  notify-failure:
    name: Notify Deployment Failure
    needs: [preBuild, build, create-release]
    runs-on: ubuntu-latest
    if: failure() && needs.preBuild.result != 'skipped'
    permissions:
      contents: read
      issues: write
    steps:
      ##############################################
      # Checkout Repository
      ##############################################
      - name: Checkout Repository
        uses: actions/checkout@v6

      ##############################################
      # Send Failure Notification
      ##############################################
      - name: Send Failure Notification
        uses: ./.github/actions/deployment-notification
        with:
          deployment_status: failure
          environment: production
          version: ${{ needs.preBuild.outputs.version_number }}
          branch: main
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          email_recipients: ${{ secrets.DEPLOYMENT_EMAIL_RECIPIENTS }}
