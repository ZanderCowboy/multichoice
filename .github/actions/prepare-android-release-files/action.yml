name: "Prepare Android Release Files"
description: "Creates keystore, key.properties, environment config JSON, and validates google-services.json"

inputs:
  android_keystore_base64:
    description: "Base64-encoded Android keystore"
    required: true
  store_password:
    description: "Android keystore store password"
    required: true
  key_password:
    description: "Android keystore key password"
    required: true
  key_alias:
    description: "Android keystore alias"
    required: true
  config_b64:
    description: "Base64-encoded flat environment config JSON (dart-defines)"
    required: true
  google_services_b64:
    description: "Base64-encoded google-services.json"
    required: true
  flavor:
    description: "Android product flavor (dev or prod)"
    required: true
  package_name:
    description: "Android package name to validate in google-services.json"
    required: true

runs:
  using: "composite"
  steps:
    - name: Decode Android keystore file
      id: android_keystore
      uses: timheuer/base64-to-file@v1.2.4
      with:
        fileName: upload-keystore.jks
        encodedString: ${{ inputs.android_keystore_base64 }}

    - name: Create key.properties
      shell: bash
      working-directory: apps/multichoice/android/
      env:
        STORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
        STORE_PASSWORD: ${{ inputs.store_password }}
        KEY_PASSWORD: ${{ inputs.key_password }}
        KEY_ALIAS: ${{ inputs.key_alias }}
      run: |
        cat > key.properties <<EOF
        storeFile=${STORE_FILE}
        storePassword=${STORE_PASSWORD}
        keyPassword=${KEY_PASSWORD}
        keyAlias=${KEY_ALIAS}
        EOF

    - name: Decode environment config and google-services.json
      shell: bash
      env:
        CONFIG_B64: ${{ inputs.config_b64 }}
        GOOGLE_SERVICES_B64: ${{ inputs.google_services_b64 }}
        FLAVOR: ${{ inputs.flavor }}
        PACKAGE_NAME: ${{ inputs.package_name }}
      run: |
        set -euo pipefail

        if [ "$FLAVOR" = "dev" ]; then
          CONFIG_FILE="apps/multichoice/config/develop_config.json"
        else
          CONFIG_FILE="apps/multichoice/config/production_config.json"
        fi

        mkdir -p apps/multichoice/config
        mkdir -p "apps/multichoice/android/app/src/${FLAVOR}"

        printf '%s' "$CONFIG_B64" | base64 --decode > "$CONFIG_FILE"
        printf '%s' "$GOOGLE_SERVICES_B64" | base64 --decode > "apps/multichoice/android/app/src/${FLAVOR}/google-services.json"

        python3 - <<'PY'
        import json
        import os

        flavor = os.environ['FLAVOR']
        package_name = os.environ['PACKAGE_NAME']
        config_file = (
          'apps/multichoice/config/develop_config.json'
          if flavor == 'dev'
          else 'apps/multichoice/config/production_config.json'
        )
        google_services_file = f'apps/multichoice/android/app/src/{flavor}/google-services.json'

        with open(config_file, encoding='utf-8') as f:
          dart_config = json.load(f)

        android_app_id = dart_config.get('ANDROID_APP_ID')
        android_api_key = dart_config.get('ANDROID_API_KEY')
        if not android_app_id or not android_api_key:
          raise SystemExit(f'{config_file} must contain ANDROID_APP_ID and ANDROID_API_KEY.')

        with open(google_services_file, encoding='utf-8') as f:
          google_services = json.load(f)

        matching_clients = [
          client for client in google_services.get('client', [])
          if client.get('client_info', {}).get('android_client_info', {}).get('package_name') == package_name
        ]

        if not matching_clients:
          raise SystemExit(f'{google_services_file} does not contain package {package_name}.')

        client = matching_clients[0]
        mobilesdk_app_id = client.get('client_info', {}).get('mobilesdk_app_id')
        if mobilesdk_app_id != android_app_id:
          raise SystemExit(
            'ANDROID_APP_ID in config does not match google-services.json '
            f'({android_app_id} != {mobilesdk_app_id}).'
          )

        api_keys = client.get('api_key', [])
        if not api_keys:
          raise SystemExit(f'{google_services_file} does not contain an Android API key.')

        current_api_key = api_keys[0].get('current_key')
        if current_api_key != android_api_key:
          raise SystemExit(
            'ANDROID_API_KEY in config does not match google-services.json '
            f'({android_api_key} != {current_api_key}).'
          )

        print('Environment config and google-services.json validated successfully.')
        PY
